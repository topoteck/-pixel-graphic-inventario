<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Graphic — Inventario TI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
  --ink:#0B2338; --ink-soft:#3B5166;
  --bg:#F3F6F8; --surface:#FFFFFF; --surface-2:#EAF0F4;
  --border:#D8E1E8;
  --blue:#1D5FA5; --blue-deep:#12406F; --blue-soft:#E7F0F9;
  --amber:#C77D2E; --amber-soft:#FBEEDD;
  --green:#2F8F5B; --green-soft:#E5F4EC;
  --red:#C1443C; --red-soft:#FBEAE8;
  --radius:10px;
  --shadow:0 1px 2px rgba(11,35,56,.06), 0 4px 14px rgba(11,35,56,.06);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --ink:#E7EEF4; --ink-soft:#A9BBC9;
    --bg:#0B1620; --surface:#101F2C; --surface-2:#16283670;
    --border:#213544;
    --blue:#5B9BD9; --blue-deep:#8FC0EE; --blue-soft:#132B3E;
    --amber:#E3A75B; --amber-soft:#332312;
    --green:#6FC796; --green-soft:#12291D;
    --red:#E37C74; --red-soft:#331512;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ink:#E7EEF4; --ink-soft:#A9BBC9;
  --bg:#0B1620; --surface:#101F2C; --surface-2:#16283670;
  --border:#213544;
  --blue:#5B9BD9; --blue-deep:#8FC0EE; --blue-soft:#132B3E;
  --amber:#E3A75B; --amber-soft:#332312;
  --green:#6FC796; --green-soft:#12291D;
  --red:#E37C74; --red-soft:#331512;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans',-apple-system,Segoe UI,sans-serif;
  font-size:14px; line-height:1.5;
  min-height:100vh;
}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13px;}
a{color:var(--blue);}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:230px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:22px 16px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; flex-direction:column; align-items:flex-start; gap:8px; margin-bottom:26px; padding:4px 4px 10px;}
.brand-logo{width:100%; max-width:172px; height:auto; display:block; background:#fff; border-radius:8px; padding:10px 12px; box-sizing:border-box;}
.brand-mark{
  width:34px;height:34px;border-radius:8px; background:linear-gradient(155deg,var(--blue),var(--blue-deep));
  display:flex;align-items:center;justify-content:center; color:#fff; font-weight:700; font-size:15px; flex:none;
}
.brand-text .t1{font-weight:700; font-size:14.5px; line-height:1.15;}
.brand-text .t2{font-size:11px; color:var(--ink-soft); letter-spacing:.02em; margin-left:2px;}

nav{display:flex; flex-direction:column; gap:2px;}
.navbtn{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; border:none;
  background:transparent; color:var(--ink-soft); font-size:13.5px; font-weight:500; text-align:left; width:100%;
  transition:background .12s, color .12s;
}
.navbtn:hover{background:var(--surface-2); color:var(--ink);}
.navbtn.active{background:var(--blue-soft); color:var(--blue-deep); font-weight:600;}
.navbtn .ic{width:18px; text-align:center; font-size:14px;}

.sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--border); font-size:11px; color:var(--ink-soft);}

.main{flex:1; min-width:0; padding:26px 34px 60px;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:14px; flex-wrap:wrap;}
.topbar h1{font-size:20px; margin:0; font-weight:700;}
.topbar p{margin:2px 0 0; color:var(--ink-soft); font-size:12.5px;}

.btn{
  border:1px solid var(--border); background:var(--surface); color:var(--ink); padding:8px 14px;
  border-radius:8px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:7px;
  transition:border-color .12s, background .12s;
}
.btn:hover{border-color:var(--blue);}
.btn-primary{background:var(--blue); color:#fff; border-color:var(--blue);}
.btn-primary:hover{background:var(--blue-deep); border-color:var(--blue-deep);}
.btn-danger{color:var(--red); border-color:var(--red);}
.btn-danger:hover{background:var(--red-soft);}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:7px;}

/* ---------- KPIs ---------- */
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
@media (max-width:920px){.kpis{grid-template-columns:repeat(2,1fr);}}
.kpi{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;
  box-shadow:var(--shadow);
}
.kpi .num{font-size:26px; font-weight:700; font-family:'IBM Plex Mono',monospace; line-height:1;}
.kpi .lbl{margin-top:6px; font-size:12.5px; color:var(--ink-soft);}
.kpi.warn .num{color:var(--amber);}
.kpi.bad .num{color:var(--red);}
.kpi.good .num{color:var(--green);}

.grid2{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
@media (max-width:920px){.grid2{grid-template-columns:1fr;}}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
.card h3{margin:0; padding:14px 18px; font-size:13.5px; border-bottom:1px solid var(--border); font-weight:600;}
.card .body{padding:6px 0;}

.alert-row{display:flex; align-items:center; gap:10px; padding:10px 18px; border-bottom:1px solid var(--border); font-size:13px;}
.alert-row:last-child{border-bottom:none;}
.alert-row .dot{width:8px;height:8px;border-radius:50%;flex:none;}
.dot-red{background:var(--red);} .dot-amber{background:var(--amber);} .dot-green{background:var(--green);}
.alert-row .main{flex:1; min-width:0;}
.alert-row .main .t{font-weight:600;}
.alert-row .main .s{color:var(--ink-soft); font-size:12px;}
.alert-row .badge{flex:none;}
.empty{padding:26px 18px; text-align:center; color:var(--ink-soft); font-size:13px;}

/* ---------- badges ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600; white-space:nowrap;}
.badge-green{background:var(--green-soft); color:var(--green);}
.badge-amber{background:var(--amber-soft); color:var(--amber);}
.badge-red{background:var(--red-soft); color:var(--red);}
.badge-gray{background:var(--surface-2); color:var(--ink-soft);}
.badge-blue{background:var(--blue-soft); color:var(--blue-deep);}

/* ---------- toolbar / table ---------- */
.toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.search{
  flex:1; min-width:180px; display:flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--border); border-radius:8px; padding:8px 12px;
}
.search input{border:none; outline:none; background:transparent; color:var(--ink); width:100%; font-size:13px;}
select.filter{
  border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:8px; padding:8px 10px; font-size:13px;
}

.tablewrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:auto;}
table{width:100%; border-collapse:collapse; min-width:640px;}
thead th{
  text-align:left; font-size:11.5px; text-transform:none; color:var(--ink-soft); font-weight:600;
  padding:10px 14px; border-bottom:1px solid var(--border); background:var(--surface-2); white-space:nowrap;
  position:sticky; top:0;
}
tbody td{padding:10px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:background .1s;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:var(--surface-2);}
td.num, th.num{font-family:'IBM Plex Mono',monospace; font-size:12.5px;}
.rowactions{display:flex; gap:6px; opacity:.75;}

/* ---------- modal / drawer ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(8,18,28,.45); display:none; align-items:center; justify-content:center;
  z-index:50; padding:20px;
}
.overlay.show{display:flex;}
.modal{
  background:var(--surface); border-radius:14px; width:100%; max-width:560px; max-height:88vh; overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.3); border:1px solid var(--border);
}
.modal.modal-wide{max-width:720px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
.modal-head h2{margin:0; font-size:16px;}
.modal-body{padding:18px 20px;}
.modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}
.iconbtn{border:none; background:transparent; color:var(--ink-soft); font-size:18px; line-height:1; padding:4px;}
.iconbtn:hover{color:var(--ink);}

/* ---------- plantilla imprimible: orden de compra ---------- */
.print-overlay{position:fixed; inset:0; background:var(--bg); z-index:70; display:none; overflow:auto;}
.print-overlay.show{display:block;}
.print-toolbar{
  position:sticky; top:0; display:flex; justify-content:space-between; align-items:center;
  padding:14px 24px; background:var(--surface); border-bottom:1px solid var(--border); z-index:2;
}
.print-area{
  max-width:760px; margin:28px auto 60px; background:#fff; color:#12203A; padding:44px 48px;
  border-radius:10px; box-shadow:var(--shadow); border:1px solid var(--border); font-size:13px;
}
.po-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid #1D5FA5; padding-bottom:16px; margin-bottom:18px;}
.po-company{font-size:20px; font-weight:700; color:#12406F; letter-spacing:.02em;}
.po-sub{font-size:13px; color:#5B7284; margin-top:2px;}
.po-meta{text-align:right; font-size:12.5px; line-height:1.7;}
.po-provider{margin-bottom:18px;}
.po-table{width:100%; border-collapse:collapse; margin-top:8px; font-size:12.5px;}
.po-table th{text-align:left; background:#EAF0F4; padding:8px 10px; border:1px solid #D8E1E8;}
.po-table td{padding:8px 10px; border:1px solid #D8E1E8;}
.po-table tfoot td{border:none; padding-top:10px;}
.po-signatures{display:flex; gap:60px; margin-top:60px;}
.po-sign{flex:1; text-align:center; font-size:12px; color:#5B7284;}
.po-sig-img{display:block; margin:0 auto 8px; max-width:78%; max-height:36px; width:auto; height:auto; object-fit:contain;}
.po-line{border-top:1px solid #12203A; margin-bottom:6px; height:36px;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute; top:0; left:0; width:100%; margin:0; box-shadow:none; border:none; border-radius:0;}
  .no-print{display:none !important;}
}

.formgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.formgrid .full{grid-column:1/-1;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:7px; background:var(--bg); color:var(--ink);
}
.field textarea{resize:vertical; min-height:56px;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--blue); outline-offset:0; border-color:var(--blue);}
.hint{font-size:11px; color:var(--ink-soft); margin-top:4px;}

/* ---------- drawer (equipo detail) ---------- */
.drawer-overlay{position:fixed; inset:0; background:rgba(8,18,28,.35); display:none; z-index:40;}
.drawer-overlay.show{display:block;}
.drawer{
  position:fixed; top:0; right:0; height:100vh; width:min(560px,94vw); background:var(--surface);
  box-shadow:-16px 0 40px rgba(0,0,0,.18); transform:translateX(100%); transition:transform .18s ease; z-index:45;
  display:flex; flex-direction:column; border-left:1px solid var(--border);
}
.drawer.show{transform:translateX(0);}
.drawer-head{padding:20px 22px; border-bottom:1px solid var(--border);}
.drawer-head .code{font-family:'IBM Plex Mono',monospace; color:var(--blue); font-size:12px; font-weight:600;}
.drawer-head h2{margin:4px 0 2px; font-size:18px;}
.drawer-head .sub{color:var(--ink-soft); font-size:12.5px;}
.drawer-tabs{display:flex; gap:4px; padding:0 22px; border-bottom:1px solid var(--border);}
.dtab{padding:10px 4px; margin-right:16px; border:none; background:transparent; color:var(--ink-soft); font-size:13px; font-weight:600; border-bottom:2px solid transparent;}
.dtab.active{color:var(--blue-deep); border-bottom-color:var(--blue);}
.drawer-body{padding:18px 22px; overflow:auto; flex:1;}
.kv{display:grid; grid-template-columns:120px 1fr; gap:8px 10px; font-size:13px;}
.kv .k{color:var(--ink-soft);}
.kv .v{font-weight:500;}
.timeline{display:flex; flex-direction:column; gap:0;}
.tl-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
.tl-item:last-child{border-bottom:none;}
.tl-dot{width:9px;height:9px;border-radius:50%; background:var(--blue); margin-top:5px; flex:none;}
.tl-content .d{font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
.tl-content .t{font-weight:600; font-size:13px; margin-top:1px;}
.tl-content .p{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

.section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); margin:18px 0 8px;}
.section-title:first-child{margin-top:0;}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg);
  padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:all .2s; z-index:80;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.loading{display:flex; align-items:center; justify-content:center; min-height:60vh; color:var(--ink-soft); font-size:13px;}
::-webkit-scrollbar{width:10px; height:10px;} ::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

@media(max-width:760px){
  .sidebar{position:fixed; left:0; top:0; z-index:60; transform:translateX(-100%); transition:transform .18s;}
  .sidebar.show{transform:translateX(0);}
  .main{padding:18px 16px 50px;}
  .formgrid{grid-template-columns:1fr;}
  .kpis{grid-template-columns:1fr 1fr;}
}

/* ---------- login ---------- */
.login-screen{position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; z-index:90; padding:20px;}
.login-screen.show{display:flex;}
.login-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:28px 26px;}
.login-card img{width:170px; height:auto; display:block; margin:0 auto 18px; background:#fff; border-radius:10px; padding:10px 14px;}
.login-card h1{font-size:17px; margin:0 0 4px; text-align:center;}
.login-card p.sub{margin:0 0 18px; text-align:center; color:var(--ink-soft); font-size:12.5px;}
.login-card .field{margin-bottom:12px;}
.login-card .btn{width:100%; justify-content:center;}
.login-links{display:flex; justify-content:space-between; gap:8px; margin-top:12px;}
.login-links button{border:none; background:transparent; color:var(--blue); font-size:12.5px; padding:4px 0; cursor:pointer;}
.login-msg{min-height:18px; margin-top:12px; font-size:12.5px; color:var(--red); text-align:center;}
.login-msg.ok{color:var(--green);}
@media print{
  html,body{background:#fff !important;}
  #app,#loading,.loading,.drawer,.drawer-overlay,.overlay,.toast,.login-screen{display:none !important;}
  .print-overlay{position:absolute !important; inset:0 auto auto 0 !important; width:100%; overflow:visible !important; background:#fff !important;}
}
</style>
</head>

///////////////////////// UTILIDADES /////////////////////////
function todayStr(){ const d = new Date(); return d.toISOString().slice(0,10); }
function addMonths(dateStr, months){
  if(!dateStr || months===undefined || months===null || months==='') return null;
  const d = new Date(dateStr+'T00:00:00');
  d.setMonth(d.getMonth()+Number(months));
  return d;
}
function daysUntil(date){
  if(!date) return null;
  const today = new Date(todayStr()+'T00:00:00');
  return Math.round((date - today)/86400000);
}
function fmtDate(d){
  if(!d) return '—';
  let dt = (typeof d === 'string') ? new Date(d+'T00:00:00') : d;
  if(isNaN(dt)) return '—';
  return dt.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtMoney(n){
  if(n===null || n===undefined || n==='') return '—';
  return '$' + Number(n).toLocaleString('es-CO');
}
function esc(s){ return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function nextEquipoCode(){
  let max = 0;
  EQUIPOS.forEach(e=>{
    const m = /^PG-(\d+)$/.exec(e.codigo||'');
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return 'PG-' + String(max+1).padStart(3,'0');
}

///////////////////////// LÓGICA DE NEGOCIO (estados calculados) /////////////////////////
function warrantyInfo(eq){
  if(!eq.fechaCompra) return {status:'Sin dato', end:null, days:null};
  const end = addMonths(eq.fechaCompra, eq.mesesGarantia || 12);
  const days = daysUntil(end);
  let status = 'Vigente';
  if(days < 0) status = 'Vencida';
  else if(days <= 60) status = 'Por vencer';
  return {status, end, days};
}
function lastMaintenanceDate(codigo){
  const evs = HISTORIAL.filter(h=>h.equipoCodigo===codigo && h.fecha)
    .sort((a,b)=> new Date(b.fecha) - new Date(a.fecha));
  return evs.length ? evs[0].fecha : null;
}
function nextMaintenanceInfo(eq){
  const last = lastMaintenanceDate(eq.codigo);
  if(!last) return {date:null, days:null, status:'Sin historial'};
  const next = addMonths(last, eq.frecuenciaMeses || 6);
  const days = daysUntil(next);
  let status = 'Al día';
  if(days < 0) status = 'Atrasado';
  else if(days <= 30) status = 'Próximo';
  return {date: next, days, status, last};
}
function licenseInfo(lic){
  if(!lic.fechaCompra) return {status:'Sin dato', end:null, days:null};
  if(!lic.vigenciaMeses) return {status:'Perpetua', end:null, days:null};
  const end = addMonths(lic.fechaCompra, lic.vigenciaMeses);
  const days = daysUntil(end);
  let status = 'Vigente';
  if(days < 0) status = 'Vencida';
  else if(days <= 30) status = 'Por vencer';
  return {status, end, days};
}
function badgeFor(status){
  const map = {
    'Vigente':'badge-green', 'Al día':'badge-green',
    'Por vencer':'badge-amber', 'Próximo':'badge-amber',
    'Vencida':'badge-red', 'Atrasado':'badge-red',
    'Sin dato':'badge-gray', 'Sin historial':'badge-gray', 'Perpetua':'badge-blue'
  };
  return map[status] || 'badge-gray';
}
function equipoByCode(code){ return EQUIPOS.find(e=>e.codigo===code); }

function mapEquipo(r){
  const e = { codigo:r.codigo, tipo:r.tipo, marca:r.marca, serial:r.serial, especificaciones:r.especificaciones, so:r.so,
    usuario:r.usuario, ubicacion:r.ubicacion, responsable:r.responsable, estado:r.estado, fechaCompra:r.fecha_compra,
    factura:r.factura, valorCompra: r.valor_compra===null ? null : Number(r.valor_compra), proveedor:r.proveedor,
    mesesGarantia:r.meses_garantia, frecuenciaMeses:r.frecuencia_meses, observaciones:r.observaciones };
  LIC_SW_FIELDS.forEach(f=>{ e[f.key] = r[licCol(f.key)]; });
  return e;
}
function mapHistorial(h, codigo){
  return { id:h.id, equipoCodigo:codigo, fecha:h.fecha, tipo:h.tipo, descripcion:h.descripcion, repuestos:h.repuestos,
    costo: h.costo===null ? null : Number(h.costo), tecnico:h.tecnico, observaciones:h.observaciones };
}
function mapLicencia(l, codigo){
  return { id:l.id, equipoCodigo:codigo, software:l.software, tipoLicencia:l.tipo_licencia, clave:l.clave,
    fechaCompra:l.fecha_compra, vigenciaMeses:l.vigencia_meses, costo: l.costo===null ? null : Number(l.costo),
    proveedor:l.proveedor, observaciones:l.observaciones };
}
function mapProveedor(p){
  return { id:p.id, nombre:p.nombre, nit:p.nit, contacto:p.contacto, telefono:p.telefono, email:p.email,
    direccion:p.direccion, observaciones:p.observaciones };
}
function mapOrden(o){
  const items = (o.ordenes_items||[]).slice().sort((a,b)=>a.posicion-b.posicion)
    .map(it=>({ descripcion:it.descripcion, cantidad:Number(it.cantidad), valorUnitario:Number(it.valor_unitario) }));
  return { id:o.numero, proveedorId:o.proveedor_id||'', proveedorNombre:o.proveedor_nombre, fecha:o.fecha,
    fechaEntrega:o.fecha_entrega, estado:o.estado, condicionPago:o.condicion_pago, aplicaIva:o.aplica_iva,
    correosDestino:o.correos_destino, observaciones:o.observaciones, items };
}

async function loadAll(){
  const [eq, prov, oc] = await Promise.all([
    sb.from('equipos').select('*, historial(*), licencias(*)').eq('empresa_id', EMPRESA_ID).order('codigo'),
    sb.from('proveedores').select('*').eq('empresa_id', EMPRESA_ID),
    sb.from('ordenes_compra').select('*, ordenes_items(*)').eq('empresa_id', EMPRESA_ID)
  ]);
  for(const r of [eq, prov, oc]){ if(r.error) throw r.error; }
  Object.keys(EQ_UUID).forEach(k=>delete EQ_UUID[k]);
  Object.keys(OC_UUID).forEach(k=>delete OC_UUID[k]);
  EQUIPOS = []; HISTORIAL = []; LICENCIAS = [];
  eq.data.forEach(r=>{
    EQ_UUID[r.codigo] = r.id;
    EQUIPOS.push(mapEquipo(r));
    (r.historial||[]).forEach(h=>HISTORIAL.push(mapHistorial(h, r.codigo)));
    (r.licencias||[]).forEach(l=>LICENCIAS.push(mapLicencia(l, r.codigo)));
  });
  PROVEEDORES = prov.data.map(mapProveedor);
  ORDENES = oc.data.map(o=>{ OC_UUID[o.numero] = o.id; return mapOrden(o); });
  renderCurrentView();
}

    uuid = data.id;
  }
  const items = d.items.map((it,i)=>({ orden_id:uuid, posicion:i+1, descripcion:it.descripcion,
    cantidad:it.cantidad, valor_unitario:it.valorUnitario }));
  const ins = await sb.from('ordenes_items').insert(items);
  if(ins.error) throw ins.error;
  await loadAll();
}
async function dbDelete(collection, id){
  let q;
  if(collection==='equipos') q = sb.from('equipos').delete().eq('id', EQ_UUID[id]);
  else if(collection==='ordenes_compra') q = sb.from('ordenes_compra').delete().eq('id', OC_UUID[id]);
  else q = sb.from(collection).delete().eq('id', id);
  const { error } = await q;
  if(error) throw error;
  await loadAll();
}

/* ---- sesión ---- */
function traducirAuthError(err){
  const m = errMsg(err);
  if(/invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
  if(/email not confirmed/i.test(m)) return 'Confirma tu correo primero (revisa tu bandeja de entrada).';
  if(/rate limit/i.test(m)) return 'Demasiados intentos. Espera unos minutos.';
  return m;
}
function showLogin(msg, ok){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').classList.add('show');
  const m = document.getElementById('loginMsg');
  m.textContent = msg || ''; m.classList.toggle('ok', !!ok);
}
async function startApp(session){
  document.getElementById('loginScreen').classList.remove('show');
  document.getElementById('loading').style.display = 'flex';
  try{
    const { data: emp, error } = await sb.from('empresas').select('id').eq('nombre', EMPRESA_NOMBRE).maybeSingle();
    if(error) throw error;
    if(!emp){
      await sb.auth.signOut();
      showLogin('Tu correo no está autorizado para usar esta aplicación.');
      return;
    }
    EMPRESA_ID = emp.id;
    await loadAll();
    document.getElementById('userEmail').textContent = (session && session.user && session.user.email) || '';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  }catch(err){
    showLogin('No se pudo cargar la información: ' + errMsg(err));
  }
}
async function init(){
  document.getElementById('loginLogo').src = LOGO_DATA_URI;
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((evt)=>{
    if(evt==='SIGNED_OUT' && !document.getElementById('loginScreen').classList.contains('show')) showLogin();
  });
  const email = ()=>document.getElementById('loginEmail').value.trim();
  const pass = ()=>document.getElementById('loginPass').value;
  document.getElementById('loginForm').onsubmit = async (e)=>{
    e.preventDefault();
    if(!pass()){ showLogin('Escribe tu contraseña.'); return; }
    const { data, error } = await sb.auth.signInWithPassword({ email:email(), password:pass() });
    if(error){ showLogin(traducirAuthError(error)); return; }
    await startApp(data.session);
  };
  document.getElementById('loginSignup').onclick = async ()=>{
    if(!email() || pass().length < 6){ showLogin('Escribe tu correo y una contraseña de al menos 6 caracteres.'); return; }
    const { data, error } = await sb.auth.signUp({ email:email(), password:pass() });
    if(error){ showLogin(traducirAuthError(error)); return; }
    if(data.session) await startApp(data.session);
    else showLogin('Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.', true);
  };
  document.getElementById('loginMagic').onclick = async ()=>{
    if(!email()){ showLogin('Escribe tu correo.'); return; }
    const { error } = await sb.auth.signInWithOtp({ email:email(), options:{ emailRedirectTo: location.origin + location.pathname } });
    if(error){ showLogin(traducirAuthError(error)); return; }
    showLogin('Te enviamos un enlace de acceso. Revisa tu correo.', true);
  };
  document.getElementById('btnLogout').onclick = async ()=>{ await sb.auth.signOut(); showLogin(); };

  const { data:{ session } } = await sb.auth.getSession();
  if(session) await startApp(session); else showLogin();
}

let ocFilters = {q:'', estado:''};
function proveedorById(id){ return PROVEEDORES.find(p=>p.id===id); }
const IVA_RATE = 0.19;
function ocRawSum(oc){ return (oc.items||[]).reduce((s,it)=> s + (Number(it.cantidad)||0)*(Number(it.valorUnitario)||0), 0); }
function ocSubtotal(oc){ return ocRawSum(oc); }
function ocIva(oc){ return oc.aplicaIva===false ? 0 : ocRawSum(oc)*IVA_RATE; }
function ocTotal(oc){ return ocSubtotal(oc) + ocIva(oc); }
function nextOrdenId(){
  let max=0; ORDENES.forEach(o=>{ const m=/^OC-(\d+)$/.exec(o.id||''); if(m) max=Math.max(max,parseInt(m[1],10)); });
  return 'OC-'+String(max+1).padStart(4,'0');
}

function ocBadgeClass(estado){

}

function renderOcTbody(){
  const tbody = document.getElementById('ocTbody');
  if(!tbody) return;
  const q = ocFilters.q.toLowerCase();
  let list = ORDENES.filter(o=>{
    if(ocFilters.estado && o.estado!==ocFilters.estado) return false;
    if(q && !`${o.id} ${o.proveedorNombre}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));

  if(!list.length){ tbody.innerHTML = `<tr><td colspan="7" class="empty">No hay órdenes de compra todavía.</td></tr>`; return; }

  tbody.innerHTML = list.map(o=>`

      <td>${esc(o.proveedorNombre)}</td>
      <td class="mono">${fmtDate(o.fecha)}</td>

      <td><span class="badge ${ocBadgeClass(o.estado)}">${esc(o.estado)}</span></td>
      <td class="num">${fmtMoney(ocTotal(o))}</td>
      <td><div class="rowactions">
        <button class="btn btn-sm btn-ghost" data-view="${esc(o.id)}">Ver / Imprimir</button>
        <button class="btn btn-sm btn-danger" data-del="${esc(o.id)}">Eliminar</button>
      </div></td>
    </tr>`).join('');

  tbody.querySelectorAll('[data-view]').forEach(b=> b.onclick = (ev)=>{ev.stopPropagation(); openOrdenPrintable(b.dataset.view);});
  tbody.querySelectorAll('[data-del]').forEach(b=> b.onclick = (ev)=>{ev.stopPropagation(); confirmDelete('ordenes_compra', b.dataset.del, 'esta orden de compra');});

function readOcItemsFromDom(){
  document.querySelectorAll('.oc-item-row').forEach((row,idx)=>{
    ocItemsDraft[idx] = {
      descripcion: row.querySelector('[data-f=desc]').value,
      cantidad: Number(row.querySelector('[data-f=cant]').value)||0,
      valorUnitario: Number(row.querySelector('[data-f=vu]').value)||0
    };
  });
}
function renderOcItems(){
  const wrap = document.getElementById('ocItemsWrap');
  wrap.innerHTML = ocItemsDraft.map((it,idx)=>`
    <div class="oc-item-row" style="display:grid; grid-template-columns:1fr 90px 120px 110px 34px; gap:8px; margin-bottom:8px; align-items:center;">
      <input data-f="desc" placeholder="Descripción del ítem" value="${esc(it.descripcion)}">
      <input data-f="cant" type="number" min="0" placeholder="Cant." value="${it.cantidad}">
      <input data-f="vu" type="number" min="0" placeholder="Valor unitario" value="${it.valorUnitario}">
      <div class="mono oc-item-subtotal" style="font-size:12.5px; text-align:right;">${fmtMoney((Number(it.cantidad)||0)*(Number(it.valorUnitario)||0))}</div>
      <button type="button" class="iconbtn oc-item-del" title="Eliminar ítem">&times;</button>
    </div>
  `).join('');
  wrap.querySelectorAll('.oc-item-row').forEach((row, idx)=>{
    row.querySelectorAll('input').forEach(inp=> inp.addEventListener('input', ()=>{
      readOcItemsFromDom();
      row.querySelector('.oc-item-subtotal').textContent = fmtMoney((Number(ocItemsDraft[idx].cantidad)||0)*(Number(ocItemsDraft[idx].valorUnitario)||0));
      updateOcTotalPreview();
    }));
    row.querySelector('.oc-item-del').onclick = ()=>{ ocItemsDraft.splice(idx,1); if(!ocItemsDraft.length) ocItemsDraft.push({descripcion:'',cantidad:1,valorUnitario:0}); renderOcItems(); };
  });
  updateOcTotalPreview();
}
function updateOcTotalPreview(){
  const raw = ocItemsDraft.reduce((s,it)=> s+(Number(it.cantidad)||0)*(Number(it.valorUnitario)||0), 0);
  const modoSel = document.getElementById('ocIvaModo');
  const aplicaIva = modoSel ? modoSel.value!=='no' : true;
  const subtotal = raw;
  const iva = aplicaIva ? raw*IVA_RATE : 0;
  const total = subtotal + iva;
  const elSub = document.getElementById('ocSubtotalPreview');
  const elIva = document.getElementById('ocIvaPreview');
  const elp = document.getElementById('ocTotalPreview');
  if(elSub) elSub.textContent = fmtMoney(subtotal);
  if(elIva) elIva.textContent = fmtMoney(iva);
  if(elp) elp.textContent = fmtMoney(total);
}

///////////////////////// GENERAR PDF REAL DE LA ORDEN /////////////////////////
function moneyPdf(n){ return '$' + Number(n||0).toLocaleString('es-CO'); }

function buildOrderPdf(o){
  const prov = proveedorById(o.proveedorId);
  const { jsPDF } = window.jspdf || {};
  if(!jsPDF) return null;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const marginX = 18; let y = 20; const pageW = 210; const pageBottom = 280;

  const logoW = 38, logoH = logoW*(256/512);
  try{ doc.addImage(LOGO_DATA_URI_PDF, 'PNG', marginX, 10, logoW, logoH); }catch(e){}
  doc.setFontSize(11); doc.setTextColor(91,114,132); doc.setFont('helvetica','normal');
  doc.text('Orden de Compra', marginX, 10+logoH+6);
  y = 10+logoH+6;

  doc.setFontSize(9); doc.setTextColor(20,30,40);
  const metaLines = [
    `N° Orden: ${o.id}`, `Fecha: ${fmtDate(o.fecha)}`,
    `Entrega esperada: ${o.fechaEntrega?fmtDate(o.fechaEntrega):'—'}`, `Estado: ${o.estado}`,
    `Condición de pago: ${o.condicionPago||'Contado'}`
  ];
  metaLines.forEach((l,i)=> doc.text(l, pageW-marginX, 8+ i*4.6, {align:'right'}));

  y += 16;
  doc.setDrawColor(29,95,165); doc.setLineWidth(0.8); doc.line(marginX, y, pageW-marginX, y);
  y += 8;

  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(18,64,111);
  doc.text('PROVEEDOR', marginX, y); y += 5.5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(20,30,40);
  const provLines = [
    ['Nombre', o.proveedorNombre||'—'], ['NIT', prov?.nit||'—'], ['Contacto', prov?.contacto||'—'],
    ['Teléfono', prov?.telefono||'—'], ['Email', prov?.email||'—'], ['Dirección', prov?.direccion||'—']
  ];
  provLines.forEach(([k,v])=>{ doc.setFont('helvetica','bold'); doc.text(k+':', marginX, y);
    doc.setFont('helvetica','normal'); doc.text(String(v), marginX+28, y); y+=5; });

  y += 4;
  // tabla de items
  const cols = [
    {label:'#', x:marginX, w:8},
    {label:'Descripción', x:marginX+8, w:84},
    {label:'Cant.', x:marginX+92, w:16},
    {label:'Valor unit.', x:marginX+108, w:32},
    {label:'Subtotal', x:marginX+140, w:34}
  ];
  const tableRight = marginX+174;
  function tableHeader(){
    doc.setFillColor(234,240,244); doc.rect(marginX, y, tableRight-marginX, 7, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(18,64,111);
    cols.forEach(c=> doc.text(c.label, c.x+1, y+5));
    y += 7;
  }
  tableHeader();
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(20,30,40);
  (o.items||[]).forEach((it,i)=>{
    const desc = doc.splitTextToSize(String(it.descripcion||''), cols[1].w-2);
    const rowH = Math.max(6, desc.length*4.2+2);
    if(y+rowH > pageBottom){ doc.addPage(); y=20; tableHeader(); }
    doc.text(String(i+1), cols[0].x+1, y+4.5);
    doc.text(desc, cols[1].x+1, y+4.5);
    doc.text(String(it.cantidad), cols[2].x+1, y+4.5);
    doc.text(moneyPdf(it.valorUnitario), cols[3].x+1, y+4.5);
    doc.text(moneyPdf((Number(it.cantidad)||0)*(Number(it.valorUnitario)||0)), cols[4].x+1, y+4.5);
    doc.setDrawColor(216,225,232); doc.line(marginX, y+rowH, tableRight, y+rowH);
    y += rowH;
  });

  y += 6;
  if(y+24 > pageBottom){ doc.addPage(); y=20; }
  const totals = [['Subtotal', ocSubtotal(o)], [o.aplicaIva===false?'IVA (no aplica)':'IVA (19%)', ocIva(o)], ['Total', ocTotal(o)]];
  totals.forEach(([label,val],i)=>{
    doc.setFont('helvetica', label==='Total'?'bold':'normal'); doc.setFontSize(10);
    doc.text(label, tableRight-50, y, {align:'left'});
    doc.text(moneyPdf(val), tableRight, y, {align:'right'});
    y += 6;
  });

  if(o.observaciones){
    y += 4;
    if(y+16 > pageBottom){ doc.addPage(); y=20; }
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(18,64,111);
    doc.text('OBSERVACIONES / CONDICIONES', marginX, y); y+=5;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(20,30,40);
    const obsLines = doc.splitTextToSize(o.observaciones, tableRight-marginX);
    doc.text(obsLines, marginX, y); y += obsLines.length*4.4;
  }

  y = Math.max(y+24, pageBottom-24);
  if(y > pageBottom){ doc.addPage(); y = pageBottom-24; }
  const sigW = 30, sigH = sigW*(219/1090);
  try{ doc.addImage(SIGNATURE_JONNATHAN, 'PNG', marginX+35-sigW/2, y-sigH-4, sigW, sigH); }catch(e){}
  const sigW2 = 26, sigH2 = sigW2*(171/278);
  try{ doc.addImage(SIGNATURE_ALEX, 'PNG', marginX+135-sigW2/2, y-sigH2-2, sigW2, sigH2); }catch(e){}
  doc.setDrawColor(20,30,40);
  doc.line(marginX, y, marginX+70, y); doc.line(marginX+100, y, marginX+170, y);
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(20,30,40);
  doc.text('Jonnathan Moreno', marginX+35, y+5, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(91,114,132);
  doc.text('Elaborado por', marginX+35, y+9.5, {align:'center'});
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(20,30,40);
  doc.text('Alex Hincapié', marginX+135, y+5, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(91,114,132);
  doc.text('Autorizado por', marginX+135, y+9.5, {align:'center'});

  return doc;
}

function generateOrderPdfBlob(o){
  const doc = buildOrderPdf(o);
  if(!doc) return null;
  return doc.output('blob');
}

///////////////////////// EMITIR + ENVIAR ORDEN POR CORREO /////////////////////////
async function emitirYEnviarOrden(o){
  const blob = generateOrderPdfBlob(o);
  const filename = `${o.id}_orden_compra.pdf`;
  if(!blob){ toast('No se pudo generar el PDF (librería no cargada)'); return; }

  let downloaded = false;
  try{ saveBlob(filename, blob); downloaded = true; }catch(err){ /* seguimos e igual abrimos el correo */ }

  const correos = (o.correosDestino||'').split(',').map(s=>s.trim()).filter(Boolean).join(',');
  if(!correos){
    toast(downloaded ? 'PDF descargado. Agrega correos destino para enviarlo automáticamente.' : 'Orden creada. Agrega correos destino para poder enviarla.');
    return;
  }
  const subject = `Orden de Compra ${o.id} — Pixel Graphic`;
  const body = `Estimado(a) ${o.proveedorNombre||''},\n\n`+
    `Adjunto la orden de compra ${o.id} de Pixel Graphic.\n`+
    `Total (IVA incluido): ${fmtMoney(ocTotal(o))}\n\n`+
    (downloaded ? `Se descargó el archivo "${filename}" — por favor adjúntalo a este correo antes de enviarlo (el navegador no permite adjuntarlo de forma automática).\n\n` : '')+
    `Saludos,\nPixel Graphic`;
  const a = document.createElement('a');
  a.href = `mailto:${encodeURIComponent(correos).replace(/%2C/g,',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  a.target = '_blank';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast(downloaded ? 'PDF descargado y correo listo para enviar' : 'Correo listo para enviar');
}

          <div><b>Entrega esperada:</b> ${o.fechaEntrega?fmtDate(o.fechaEntrega):'—'}</div>
          <div><b>Estado:</b> ${esc(o.estado)}</div>
          <div><b>Condición de pago:</b> ${esc(o.condicionPago||'Contado')}</div>
        </div>
      </div>

      <div class="po-provider">
        <div class="section-title">Proveedor</div>
        <div class="kv">
          <div class="k">Nombre</div><div class="v">${esc(o.proveedorNombre)}</div>
          <div class="k">NIT</div><div class="v">${esc(prov?.nit)||'—'}</div>
          <div class="k">Contacto</div><div class="v">${esc(prov?.contacto)||'—'}</div>
          <div class="k">Teléfono</div><div class="v">${esc(prov?.telefono)||'—'}</div>
          <div class="k">Email</div><div class="v">${esc(prov?.email)||'—'}</div>
          <div class="k">Dirección</div><div class="v">${esc(prov?.direccion)||'—'}</div>
        </div>
      </div>

      <table class="po-table">
        <thead><tr><th>#</th><th>Descripción</th><th>Cant.</th><th>Valor unitario</th><th>Subtotal</th></tr></thead>
        <tbody>
          ${(o.items||[]).map((it,i)=>`
          <tr>
            <td>${i+1}</td><td>${esc(it.descripcion)}</td><td>${it.cantidad}</td>
            <td>${fmtMoney(it.valorUnitario)}</td><td>${fmtMoney((Number(it.cantidad)||0)*(Number(it.valorUnitario)||0))}</td>
          </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr><td colspan="4" style="text-align:right;">Subtotal</td><td>${fmtMoney(ocSubtotal(o))}</td></tr>
          <tr><td colspan="4" style="text-align:right;">${o.aplicaIva===false?'IVA (no aplica)':'IVA (19%)'}</td><td>${fmtMoney(ocIva(o))}</td></tr>
          <tr><td colspan="4" style="text-align:right;"><b>Total</b></td><td><b>${fmtMoney(total)}</b></td></tr>
        </tfoot>
      </table>

      ${o.observaciones? `<div class="section-title">Observaciones / Condiciones</div><div style="font-size:13px;">${esc(o.observaciones)}</div>` : ''}

      <div class="po-signatures">
        <div class="po-sign"><img src="${SIGNATURE_JONNATHAN}" alt="Firma" class="po-sig-img"><div class="po-line"></div><div><b>Jonnathan Moreno</b></div><div>Elaborado por</div></div>
        <div class="po-sign"><img src="${SIGNATURE_ALEX}" alt="Firma" class="po-sig-img"><div class="po-line"></div><div><b>Alex Hincapié</b></div><div>Autorizado por</div></div>
      </div>
    </div>
  `;
  document.getElementById('printOverlay').classList.add('show');
  document.getElementById('printClose').onclick = ()=> document.getElementById('printOverlay').classList.remove('show');
  document.getElementById('printEdit').onclick = ()=>{ document.getElementById('printOverlay').classList.remove('show'); openOrdenModal(id); };
  document.getElementById('printPdf').onclick = ()=>{
    const blob = generateOrderPdfBlob(o);
    if(!blob){ toast('No se pudo generar el PDF'); return; }
    saveBlob(`${o.id}_orden_compra.pdf`, blob);
    toast('PDF descargado');
  };
  document.getElementById('printBtn').onclick = ()=> window.print();
  document.getElementById('printMail').onclick = ()=> emitirYEnviarOrden(o);
}

///////////////////////// DRAWER: detalle de equipo /////////////////////////
function openDrawer(code){
  currentDrawerCode = code; drawerTab = 'info';
  document.getElementById('drawerOverlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
  renderDrawer(code);
}
function closeDrawer(){
  document.getElementById('drawerOverlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
  currentDrawerCode = null;
}
document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);

function renderDrawer(code){
  const eq = equipoByCode(code);
  const drawer = document.getElementById('drawer');
  if(!eq){ drawer.innerHTML=''; return; }
  const w = warrantyInfo(eq);
  const n = nextMaintenanceInfo(eq);
  const evs = HISTORIAL.filter(h=>h.equipoCodigo===code).sort((a,b)=> new Date(b.fecha||0)-new Date(a.fecha||0));
  const lics = LICENCIAS.filter(l=>l.equipoCodigo===code);

  drawer.innerHTML = `
    <div class="drawer-head">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <div class="code">${esc(eq.codigo)}</div>
          <h2>${esc(eq.usuario || eq.tipo)}</h2>
          <div class="sub">${esc(eq.tipo)} · ${esc(eq.marca)} · ${esc(eq.ubicacion)}</div>
        </div>
        <button class="iconbtn" id="drawerClose">&times;</button>
      </div>
    </div>
    <div class="drawer-tabs">
      <button class="dtab ${drawerTab==='info'?'active':''}" data-tab="info">Información</button>
      <button class="dtab ${drawerTab==='hist'?'active':''}" data-tab="hist">Historial (${evs.length})</button>
      <button class="dtab ${drawerTab==='lic'?'active':''}" data-tab="lic">Licencias (${lics.length})</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  `;
  document.getElementById('drawerClose').onclick = closeDrawer;
  drawer.querySelectorAll('.dtab').forEach(t=> t.onclick = ()=>{ drawerTab = t.dataset.tab; renderDrawer(code); });

  const body = document.getElementById('drawerBody');
  if(drawerTab==='info'){
    body.innerHTML = `
      <div class="section-title">Estado</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
        <span class="badge ${badgeFor(w.status)}">Garantía: ${w.status}</span>
        <span class="badge ${badgeFor(n.status)}">Mantenimiento: ${n.status}</span>
        <span class="badge badge-gray">${esc(eq.estado||'Activo')}</span>
      </div>
      <div class="section-title">Datos del equipo</div>
      <div class="kv">
        <div class="k">Serial</div><div class="v mono">${esc(eq.serial)||'—'}</div>
        <div class="k">Especificaciones</div><div class="v">${esc(eq.especificaciones)||'—'}</div>
        <div class="k">Sistema Operativo</div><div class="v">${esc(eq.so)||'—'}</div>
        <div class="k">Responsable</div><div class="v">${esc(eq.responsable)||'—'}</div>
        <div class="k">Ubicación</div><div class="v">${esc(eq.ubicacion)||'—'}</div>
      </div>
      <div class="section-title">Compra y garantía</div>
      <div class="kv">
        <div class="k">Fecha de compra</div><div class="v">${fmtDate(eq.fechaCompra)}</div>
        <div class="k">N° Factura</div><div class="v mono">${esc(eq.factura)||'—'}</div>
        <div class="k">Valor</div><div class="v">${fmtMoney(eq.valorCompra)}</div>
        <div class="k">Proveedor</div><div class="v">${esc(eq.proveedor)||'—'}</div>
        <div class="k">Garantía</div><div class="v">${eq.mesesGarantia||'—'} meses ${w.end?('· vence '+fmtDate(w.end)):''}</div>
      </div>
      <div class="section-title">Mantenimiento</div>
      <div class="kv">
        <div class="k">Frecuencia</div><div class="v">cada ${eq.frecuenciaMeses||6} meses</div>
        <div class="k">Último</div><div class="v">${fmtDate(n.last)}</div>
        <div class="k">Próximo estimado</div><div class="v">${n.date?fmtDate(n.date):'—'}</div>
      </div>
      <div class="section-title">Licenciamiento de software</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${LIC_SW_FIELDS.map(f=>{ const v=licVal(eq,f.key); return `<span class="badge ${licBadgeClass(v)}">${f.label}: ${esc(v)}</span>`; }).join('')}
      </div>
      ${eq.observaciones?`<div class="section-title">Observaciones</div><div class="v" style="font-size:13px;">${esc(eq.observaciones)}</div>`:''}
      <div style="margin-top:20px; display:flex; gap:8px;">
        <button class="btn btn-primary btn-sm" id="drawerEdit">Editar equipo</button>
        <button class="btn btn-danger btn-sm" id="drawerDel">Eliminar equipo</button>
      </div>
    `;
    document.getElementById('drawerEdit').onclick = ()=>openEquipoModal(code);
    document.getElementById('drawerDel').onclick = ()=>confirmDelete('equipos', code, `el equipo ${code}`, closeDrawer);
  } else if(drawerTab==='hist'){
    body.innerHTML = `
      <div style="margin-bottom:12px;"><button class="btn btn-primary btn-sm" id="drawerAddHist">+ Registrar evento</button></div>
      <div class="timeline">
        ${evs.length ? evs.map(h=>`
          <div class="tl-item">
            <div class="tl-dot"></div>
            <div class="tl-content">
              <div class="d">${fmtDate(h.fecha)} · ${esc(h.tipo)}</div>
              <div class="t">${esc(h.descripcion)}</div>
              ${h.repuestos?`<div class="p">Repuestos: ${esc(h.repuestos)}</div>`:''}
              <div class="p">${esc(h.tecnico)||''} ${h.costo?(' · '+fmtMoney(h.costo)):''}</div>
            </div>
          </div>`).join('') : `<div class="empty">Sin eventos registrados para este equipo.</div>`}
      </div>
    `;
    document.getElementById('drawerAddHist').onclick = ()=>openHistModal(null, code);
  } else if(drawerTab==='lic'){
    body.innerHTML = `
      <div style="margin-bottom:12px;"><button class="btn btn-primary btn-sm" id="drawerAddLic">+ Nueva licencia</button></div>
      ${lics.length ? lics.map(l=>{
        const i = licenseInfo(l);
        return `<div class="alert-row" style="padding:12px 0;">
          <div class="main"><div class="t">${esc(l.software)}</div><div class="s">${esc(l.tipoLicencia)} ${i.end?('· vence '+fmtDate(i.end)):''}</div></div>
          <span class="badge ${badgeFor(i.status)}">${i.status}</span>
        </div>`;
      }).join('') : `<div class="empty">Sin licencias registradas para este equipo.</div>`}
    `;
    document.getElementById('drawerAddLic').onclick = ()=>openLicModal(null, code);
  }
}

///////////////////////// MODALES /////////////////////////
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); document.getElementById('modal').innerHTML=''; document.getElementById('modal').className='modal'; }
document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });

function openEquipoModal(code){
  const editing = !!code;
  const eq = editing ? equipoByCode(code) : {};
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="modal-head"><h2>${editing?('Editar '+esc(code)):'Nuevo equipo'}</h2><button class="iconbtn" id="mClose">&times;</button></div>
    <div class="modal-body">
      <form id="eqForm">
        <div class="formgrid">
          <div class="field"><label>Tipo de activo</label>
            <select name="tipo">
              ${['Portátil','Equipo de Escritorio (Todo en Uno)','Impresora','Televisor','Servidor','Otro'].map(t=>`<option ${eq.tipo===t?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Marca</label><input name="marca" value="${esc(eq.marca)}" placeholder="HP, Lenovo, Apple..."></div>
          <div class="field"><label>Serial</label><input name="serial" value="${esc(eq.serial)}"></div>
          <div class="field"><label>Sistema Operativo</label><input name="so" value="${esc(eq.so)}"></div>
          <div class="field full"><label>Especificaciones</label><textarea name="especificaciones">${esc(eq.especificaciones)}</textarea></div>
          <div class="field"><label>Usuario asignado</label><input name="usuario" value="${esc(eq.usuario)}"></div>
          <div class="field"><label>Ubicación</label><input name="ubicacion" value="${esc(eq.ubicacion)}"></div>
          <div class="field"><label>Responsable</label><input name="responsable" value="${esc(eq.responsable)}"></div>
          <div class="field"><label>Estado del equipo</label>
            <select name="estado">${['Activo','En garantía','Fuera de servicio','Fuera de la ciudad','Fuera del país','De baja'].map(t=>`<option ${eq.estado===t?'selected':''}>${t}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Fecha de compra</label><input type="date" name="fechaCompra" value="${eq.fechaCompra||''}"></div>
          <div class="field"><label>N° Factura</label><input name="factura" value="${esc(eq.factura)}"></div>
          <div class="field"><label>Valor de compra</label><input type="number" name="valorCompra" value="${eq.valorCompra??''}"></div>
          <div class="field"><label>Proveedor</label><input name="proveedor" value="${esc(eq.proveedor)}"></div>
          <div class="field"><label>Meses de garantía</label><input type="number" name="mesesGarantia" value="${eq.mesesGarantia??12}"></div>
          <div class="field"><label>Frecuencia mantenimiento (meses)</label><input type="number" name="frecuenciaMeses" value="${eq.frecuenciaMeses??6}"></div>
        </div>
        <div class="section-title">Licenciamiento de software instalado</div>
        <div class="formgrid">
          ${LIC_SW_FIELDS.map(f=>`
          <div class="field"><label>${f.label}</label>
            <select name="${f.key}">${['N/A','Sí','No'].map(o=>`<option ${licVal(eq,f.key)===o?'selected':''}>${o}</option>`).join('')}</select>
          </div>`).join('')}
        </div>
        <div class="formgrid" style="margin-top:12px;">
          <div class="field full"><label>Observaciones</label><textarea name="observaciones">${esc(eq.observaciones)}</textarea></div>
        </div>
      </form>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="mCancel">Cancelar</button>
      <button class="btn btn-primary" id="mSave">${editing?'Guardar cambios':'Crear equipo'}</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mSave').onclick = async ()=>{
    const f = document.getElementById('eqForm');
    const fd = new FormData(f);
    const data = {
      tipo: fd.get('tipo')||'', marca: fd.get('marca')||'', serial: fd.get('serial')||'',
      so: fd.get('so')||'', especificaciones: fd.get('especificaciones')||'',
      usuario: fd.get('usuario')||'', ubicacion: fd.get('ubicacion')||'', responsable: fd.get('responsable')||'',
      estado: fd.get('estado')||'Activo',
      fechaCompra: fd.get('fechaCompra')||null,
      factura: fd.get('factura')||'', valorCompra: fd.get('valorCompra')? Number(fd.get('valorCompra')) : null,
      proveedor: fd.get('proveedor')||'', mesesGarantia: fd.get('mesesGarantia')? Number(fd.get('mesesGarantia')) : 12,
      frecuenciaMeses: fd.get('frecuenciaMeses')? Number(fd.get('frecuenciaMeses')) : 6,
      observaciones: fd.get('observaciones')||''
    };
    LIC_SW_FIELDS.forEach(f=>{ data[f.key] = fd.get(f.key) || 'N/A'; });
    const targetCode = editing ? code : nextEquipoCode();
    try{
      await dbSaveEquipo(targetCode, data);
      toast(editing? 'Equipo actualizado' : `Equipo ${targetCode} creado`);
      closeModal();
    }catch(err){ toast('Error al guardar: '+errMsg(err)); }
  };
}

    try{

  };

///////////////////////// ELIMINAR /////////////////////////
function confirmDelete(collection, id, label, afterFn){
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="modal-head"><h2>Eliminar</h2><button class="iconbtn" id="mClose">&times;</button></div>
    <div class="modal-body"><p>¿Seguro que quieres eliminar ${esc(label)}? Esta acción no se puede deshacer.</p></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="mCancel">Cancelar</button>
      <button class="btn btn-danger" id="mConfirm">Eliminar</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mConfirm').onclick = async ()=>{
    try{
      await dbDelete(collection, id);
      toast('Eliminado correctamente');
      closeModal();
      if(afterFn) afterFn();
    }catch(err){ toast('Error al eliminar: '+errMsg(err)); }
  };
}
